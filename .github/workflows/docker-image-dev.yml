name: Docker CI/CD

on:
  push:
    branches: [ "dev" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            # Установка Docker (если не установлен)
            if ! command -v docker &> /dev/null; then
              echo "Установка Docker..."
              sudo apt-get update
              sudo apt-get install -y \
                  apt-transport-https \
                  ca-certificates \
                  curl \
                  gnupg-agent \
                  software-properties-common
              
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
              sudo add-apt-repository \
                "deb [arch=amd64] https://download.docker.com/linux/ubuntu \
                $(lsb_release -cs) \
                stable"
              
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo systemctl enable docker
            fi

            # Установка Docker Compose
            if ! command -v docker-compose &> /dev/null; then
              echo "Установка Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.23.0/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Настройка директории проекта
            PROJECT_DIR="/gitDjangoStripe"
            REPO_URL="git@github.com:NemoKam/DjangoStripe.git"
            
            if [ ! -d "$PROJECT_DIR" ]; then
              echo "Клонирование репозитория..."
              sudo mkdir -p $PROJECT_DIR
              sudo chown -R $USER:$USER $PROJECT_DIR
              git clone $REPO_URL $PROJECT_DIR
              cd $PROJECT_DIR
              git checkout dev
            else
              echo "Обновление репозитория..."
              cd $PROJECT_DIR
              git fetch origin
              git reset --hard origin/dev
              git pull origin dev
            fi

            # Перезапуск контейнеров
            docker-compose -f docker-compose.dev.yml down
            docker image prune -f
            docker-compose -f docker-compose.dev.yml up --build -d
          EOF
